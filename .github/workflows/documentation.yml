name: docs
on:
  # Releases are created by release.yml with GITHUB_TOKEN, and GitHub doesn't
  # fire other workflows from GITHUB_TOKEN events, so `release: published`
  # never ran. workflow_run is exempt from that rule.
  workflow_run:
    workflows:
      - Release
    types:
      - completed
  workflow_dispatch:
permissions:
  contents: write
jobs:
  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: |
          pip install "mkdocs-material>=9.7,<10"
          cd docs
          mkdocs gh-deploy --force
